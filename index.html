<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Giuliano Ortu — Personal Trainer</title>
<meta name="description" content="Personal Trainer certificato. Percorso strutturato, allenamento su misura, supporto continuo." />
<link rel="icon" href="assets/logo-mark-ink.png" />
<meta name="theme-color" content="#f1eee8" />

<!-- Font, librerie e foto sono tutti ospitati nel sito: nessuna richiesta a server esterni, nessun cookie -->
<link rel="preload" href="assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="css/fonts.css" />

<!-- L'ordine conta: base → tema chiaro → home con foto → freccia → aggiunte locali -->
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/modern.css" />
<link rel="stylesheet" href="css/home.css" />
<link rel="stylesheet" href="css/scia.css" />
<link rel="stylesheet" href="css/site.css" />

<!-- React 18.3.1 (build di produzione) e Babel standalone 7.29.0, copiati da npm in js/vendor/ -->
<script src="js/vendor/react.production.min.js"></script>
<script src="js/vendor/react-dom.production.min.js"></script>
<script src="js/vendor/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="js/content.js"></script>
<script type="text/babel" src="js/legal.js"></script>
<script type="text/babel" src="js/components.jsx"></script>
<script type="text/babel" src="js/page-home.jsx"></script>
<script type="text/babel" src="js/page-esperienza.jsx"></script>
<script type="text/babel" src="js/page-pacchetti.jsx"></script>
<script type="text/babel" src="js/page-contatti.jsx"></script>
<script type="text/babel" src="js/page-legal.jsx"></script>
<script type="text/babel" src="js/scia.jsx"></script>

<script type="text/babel">
const NAV = CONTENT.nav;
// Pagine legali: raggiungibili da footer e form, ma non nel menu
const LEGAL_PAGES = Object.keys(LEGAL);

// Configurazione definitiva della freccia guida
const SCIA = { mode: 'through', drops: true, ghost: false, stations: false, w: 5 };

function readRoute() {
  const h = (window.location.hash || '').replace(/^#\/?/, '');
  const [page, ...rest] = h.split('/');
  const params = {};
  for (let i = 0; i < rest.length; i += 2) if (rest[i]) params[rest[i]] = decodeURIComponent(rest[i + 1] || '');
  const known = NAV.some((n) => n.id === page) || LEGAL_PAGES.includes(page);
  return { page: known ? page : 'home', params };
}

function App() {
  const [route, setRoute] = React.useState(readRoute());
  const [solid, setSolid] = React.useState(false);
  const [open, setOpen] = React.useState(false);

  React.useEffect(() => {
    const onHash = () => setRoute(readRoute());
    const onScroll = () => setSolid(window.scrollY > 12);
    window.addEventListener('hashchange', onHash);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => { window.removeEventListener('hashchange', onHash); window.removeEventListener('scroll', onScroll); };
  }, []);

  React.useEffect(() => { window.scrollTo({ top: 0, behavior: 'instant' }); setOpen(false); }, [route.page, route.params.pack]);

  // Su contatti il form è già in pagina: niente CTA "Prenota" (header, menu mobile, barra mobile)
  const showBar = route.page !== 'contatti';
  const isLegal = LEGAL_PAGES.includes(route.page);
  // Niente freccia guida su Pacchetti e sulle pagine legali
  const guide = route.page !== 'pacchetti' && !isLegal;
  // Su Esperienza la freccia percorre solo i passaggi del coaching online
  const sciaMode = route.page === 'esperienza' ? 'steps' : SCIA.mode;
  const pageKey = route.page + (route.params.pack || '');
  const over = route.page === 'home' && !solid && !open;
  React.useEffect(() => { document.body.classList.toggle('has-mbar', showBar); }, [showBar]);

  const go = (page, params = {}) => {
    const tail = Object.entries(params).map(([k, v]) => `${k}/${encodeURIComponent(v)}`).join('/');
    window.location.hash = `#/${page}${tail ? '/' + tail : ''}`;
  };
  const openContact = (pack, cycle) => {
    const params = {};
    if (pack) params.pack = pack;
    if (cycle && cycle !== 'mensile') params.cycle = cycle;
    go('contatti', params);
  };

  const props = { go, openContact };
  const pages = {
    home: <PageHome {...props} />,
    esperienza: <PageEsperienza {...props} />,
    pacchetti: <PagePacchetti {...props} />,
    contatti: <PageContatti key={route.params.pack || 'none'} preselectedPack={route.params.pack} preselectedCycle={route.params.cycle} />,
    ...Object.fromEntries(LEGAL_PAGES.map((id) => [id, <PageLegal key={id} id={id} />])),
  };

  const { brand, contact, footer } = CONTENT;

  return (
    <>
      <nav className={`nav ${solid ? 'solid' : ''} ${open ? 'open' : ''} ${over ? 'over' : ''}`}>
        <div className="nav-in">
          <Brand light={over} onClick={() => go('home')} />
          <div className="nav-links">
            {NAV.map((n) => <button key={n.id} className={`nav-link ${route.page === n.id ? 'on' : ''}`} onClick={() => go(n.id)}>{n.label}</button>)}
          </div>
          <div className="nav-end">
            {showBar && <button className="btn btn-line" onClick={() => openContact()}>Prenota <span className="ar">→</span></button>}
            <button className="burger" onClick={() => setOpen(!open)} aria-label="Menu" aria-expanded={open}>{open ? <Icons.Close /> : <Icons.Menu />}</button>
          </div>
        </div>
      </nav>

      {open && (
        <div className="mmenu">
          {NAV.map((n) => <button key={n.id} className={`nav-link ${route.page === n.id ? 'on' : ''}`} onClick={() => go(n.id)}>{n.label}</button>)}
          {showBar && <button className="btn btn-red" onClick={() => openContact()}>Prenota una consulenza <span className="ar">→</span></button>}
        </div>
      )}

      {pages[route.page]}

      <footer className="footer">
        <div className="wrap">
          <div className="foot-top">
            <Brand onClick={() => go('home')} />
            <p className="foot-tag"><em>{brand.tagline}</em><span>{brand.taglineSub}</span></p>
            <ul className="foot-contacts" aria-label={footer.contacts}>
              <li><a href={contact.phoneTel}><Icons.Phone s={15} />{contact.phone}</a></li>
              <li><a href={contact.emailHref}><Icons.Mail s={15} />{contact.email}</a></li>
              <li><a href={contact.instagramUrl} target="_blank" rel="noreferrer"><Icons.Instagram s={15} />{contact.instagram}</a></li>
            </ul>
          </div>
          <div className="foot-bot">
            <nav className="foot-nav" aria-label={footer.nav}>
              {NAV.map((n) => <a key={n.id} href={`#/${n.id}`}>{n.label}</a>)}
            </nav>
            <span className="foot-legal">
              <span>© {new Date().getFullYear()} {brand.fullName} · {brand.title} · {brand.vatId}</span>
              {footer.legal.filter((l) => LEGAL_PAGES.includes(l.id)).map((l) => <a key={l.id} href={`#/${l.id}`}>{l.label}</a>)}
            </span>
          </div>
        </div>
      </footer>

      {guide && <Scia key={'s' + pageKey} pageKey={pageKey} {...SCIA} mode={sciaMode} />}

      {showBar && (
        <div className="mbar">
          <a className="wa" href={contact.whatsappUrl} target="_blank" rel="noreferrer" aria-label="Scrivimi su WhatsApp"><Icons.Chat s={22} /></a>
          <button className="btn btn-red" onClick={() => openContact()}>Consulenza gratuita <span className="ar">→</span></button>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
